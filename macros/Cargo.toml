[package]
name = "prestige-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "Proc macro for deriving Prestige parquet trait implementations"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
# arrow/parquet/serde_arrow are deliberately absent: this crate only emits their
# paths as tokens, resolved via `::prestige::` re-exports at the call site.
chrono = { workspace = true, optional = true }
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[features]
chrono = ["dep:chrono"]
iceberg = []
