[package]
name = "prestige"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prestige file reading and writing utilities and tools"

[dependencies]
anyhow.workspace = true
arrow = { version = "55", features = ["ipc"] }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-types-convert.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono = { workspace = true, optional = true }
config.workspace = true
derive_builder.workspace = true
futures.workspace = true
futures-util.workspace = true
metrics.workspace = true
parquet = { version = "55", features = ["async"] }
prestige-macros = { path = "../macros" }
regex.workspace = true
retainer.workspace = true
rust_decimal = { workspace = true, optional = true }
serde.workspace = true
serde_arrow.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
super-visor.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_bytes = "0"
tempfile.workspace = true
tokio-util = "0"

[features]
default = ["chrono"]
chrono = ["dep:chrono"]
decimal = ["dep:rust_decimal"]
sqlx-postgres = ["sqlx/postgres"]
sqlx = ["dep:sqlx"]
