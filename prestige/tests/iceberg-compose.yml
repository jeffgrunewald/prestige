services:
  postgres:
    image: postgres:17
    networks:
      iceberg_net:
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: POLARIS
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # minio/minio and minio/mc are no longer published; this image contains both `minio` and `mc`.
  minio:
    image: cgr.dev/chainguard/minio:latest
    networks:
      iceberg_net:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - 9000:9000
      - 9100:9100
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9100"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 10s

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      iceberg_net:
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >-
        mc alias set minio http://minio:9000 admin password &&
        mc mb minio/iceberg || true &&
        mc mb minio/iceberg-test || true &&
        mc ls minio

  polaris-db-bootstrap:
    image: apache/polaris-admin-tool:1.3.0-incubating
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      iceberg_net:
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >-
        java -jar /deployments/polaris-admin-tool.jar bootstrap --realm=POLARIS --credential=POLARIS,root,s3cr3t ||
        true

  polaris:
    image: apache/polaris:1.3.0-incubating
    ports:
      - "8181:8181"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      polaris-db-bootstrap:
        condition: service_completed_successfully
    networks:
      iceberg_net:
    environment:
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: true
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
      polaris.readiness.ignore-severe-issues: "true"
      polaris.features."DROP_WITH_PURGE_ENABLED": "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

  # Creates the `iceberg-test` catalog that iceberg_integration.rs uses (the harness makes its own).
  # It stays up and reports healthy when the catalog exists, so `up --wait` returns after setup.
  # An existing catalog (409) skips the other steps: Polaris returns 500 for a duplicate grant.
  polaris-init:
    image: curlimages/curl:latest
    depends_on:
      polaris:
        condition: service_healthy
    networks:
      iceberg_net:
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - |
        set -eu
        api=http://polaris:8181/api
        token=$$(curl -sf "$$api/catalog/v1/oauth/tokens" \
          -d grant_type=client_credentials -d client_id=root -d client_secret=s3cr3t \
          -d scope=PRINCIPAL_ROLE:ALL | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        [ -n "$$token" ] || { echo "no OAuth2 token from Polaris" >&2; exit 1; }
        call() {
          status=$$(curl -s -o /dev/null -w '%{http_code}' -X "$$1" "$$api/management/v1$$2" \
            -H "Authorization: Bearer $$token" -H 'Content-Type: application/json' -d "$$3")
          echo "$$1 $$2 -> $$status"
          case "$$status" in
            2??) return 0 ;;
            409) return 2 ;;
            *) exit 1 ;;
          esac
        }
        if call POST /catalogs '{"catalog":{"name":"iceberg-test","type":"INTERNAL","readOnly":false,"properties":{"default-base-location":"s3://iceberg-test/iceberg-test"},"storageConfigInfo":{"storageType":"S3","allowedLocations":["s3://iceberg-test/iceberg-test"],"endpoint":"http://minio:9000","pathStyleAccess":true}}}'; then
          call POST /catalogs/iceberg-test/catalog-roles '{"catalogRole":{"name":"admin"}}'
          call PUT /catalogs/iceberg-test/catalog-roles/admin/grants '{"grant":{"type":"catalog","privilege":"CATALOG_MANAGE_CONTENT"}}'
          call PUT /principal-roles/service_admin/catalog-roles/iceberg-test '{"catalogRole":{"name":"admin"}}'
        else
          echo "catalog iceberg-test exists; setup skipped"
        fi
        touch /tmp/catalog-ready
        trap 'exit 0' TERM INT
        sleep 2147483647 & wait
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/catalog-ready"]
      interval: 1s
      timeout: 5s
      retries: 60

networks:
  iceberg_net:

volumes:
  postgres_data:
  minio_data:
