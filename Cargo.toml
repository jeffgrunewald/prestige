[workspace]
members = ["prestige", "cli", "macros"]

resolver = "3"

[workspace.package]
version = "0.5.0"
authors = ["Jeff Grunewald <jeff@grunewalddesign.com>"]
readme = "README.md"
description = "Library for creating streaming sources and sinks for efficient iceberg tables and parquet files in S3-compatible object storage"
homepage = "https://github.com/jeffgrunewald/prestige"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffgrunewald/prestige"
keywords = ["s3", "parquet", "sink", "streaming", "iceberg"]
categories = ["asynchronous", "encoding", "filesystem"]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arrow = { version = "58", features = ["ipc"] }
arrow-row = "58"
arrow-select = "58"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-smithy-types-convert = { version = "0.62", features = ["convert-streams"] }
blake3 = "1"
bytes = "1"
config = { version = "0.15", default-features = false, features = ["toml"] }
derive_builder = "0.20"
futures = "0.3"
futures-util = "0.3"
iceberg = "0.11"
iceberg-catalog-rest = "0.11"
iceberg-catalog-s3tables = "0.11"
iceberg-catalog-sql = "0.11"
iceberg-storage-opendal = "0.11"
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
jiff-sqlx = { version = "1", features = ["postgres"] }
parquet = { version = "58", features = ["async"] }
regex = "1"
retainer = "0.5"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_arrow = { version = "0.15.1", features = ["arrow-58"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["postgres", "uuid", "macros", "runtime-tokio", "tls-rustls"] }
super-visor = "0.3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
  "fs",
  "macros",
  "rt-multi-thread",
] }
tokio-stream = "0.1"
tracing = "0.1"
tempfile = "3"
