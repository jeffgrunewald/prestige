[workspace]
members = ["prestige", "cli", "macros"]

resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Jeff Grunewald <jeff@grunewalddesign.com>"]
readme = "README.md"
description = "Library for creating streaming sources and sinks for efficient parquet files in S3-compatible object storage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffgrunewald/prestige-rs"
keywords = ["database", "async", "file", "s3", "object-storage", "parquet", "sink", "streaming", "storage", "analytics"]
categories = ["asynchronous", "encoding", "filesystem"]
edition = "2024"

[workspace.dependencies]
aws-config = "1"
aws-sdk-s3 = "1"
blake3 = "1"
bytes = "1"
chrono = { version = "0", features = ["serde"] }
config = { version = "0", default-features = false, features = ["toml"] }
futures = "0"
futures-util = "0"
metrics = "0"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_arrow = { version = "0.13", features = ["arrow-55"] }
serde_json = "1"
sha2 = "0"
sqlx = { version = "0", features = ["postgres", "uuid", "chrono", "macros", "runtime-tokio-rustls"] }
super-visor = { version = "0" }
thiserror = "1"
tokio = { version = "1", default-features = false, features = [
  "fs",
  "macros",
] }
tracing = "0"
